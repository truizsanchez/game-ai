[project]
name = "gameai"
version = "0.1.0"
description = "Pythonic port of Programming Game AI by Example, visualized with arcade"
authors = [
    { name = "truizsanchez" }
]
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "arcade>=3.3.3",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py313"
# Chapter 6 game scripts run with names injected by the host, so they are not linted as modules.
extend-exclude = ["src/gameai/ch06_scripting/scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "PL", "PTH"]
ignore = [
    "PLR2004",  # magic numbers are everywhere in game/AI tuning code
    "PLR0911",  # match-based dispatchers (behaviors, messages) are flat return chains
    "PLR0912",
    "PLR0913",  # entity constructors and physics helpers naturally take many parameters
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.mypy]
strict = true
files = ["src", "tests"]
exclude = ["src/gameai/ch06_scripting/scripts/"]

[[tool.mypy.overrides]]
module = ["arcade.*", "pyglet.*"]
ignore_missing_imports = true
